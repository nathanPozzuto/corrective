# --- Datasource -------------------------------------------------------------
# Neon is standard Postgres, so we connect over JDBC using the same credentials
# the Next.js app uses. These PG* variables are the ones Neon provisions.
# You can also override everything with a single SPRING_DATASOURCE_URL.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${PGHOST}/${PGDATABASE}?sslmode=require}
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- Server -----------------------------------------------------------------
server.port=${PORT:8080}

# Serialize timestamps as ISO strings instead of epoch arrays.
spring.jackson.serialization.write-dates-as-timestamps=false

# --- AI Gateway (PT handout scanning) --------------------------------------
# Set this to a Vercel AI Gateway API key to enable /api/scan-handout.
ai.gateway.key=${AI_GATEWAY_API_KEY:}
ai.gateway.url=${AI_GATEWAY_URL:https://ai-gateway.vercel.sh/v1/chat/completions}
ai.gateway.model=${AI_GATEWAY_MODEL:openai/gpt-4o-mini}
