<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recovery Tracker</title>
    <meta
      name="description"
      content="Track workouts, log pain, scan PT handouts, and schedule your recovery."
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- Auth screen -->
    <div id="auth" class="auth-screen">
      <div class="auth-card">
        <div class="brand"><span class="dot">R</span> Recovery Tracker</div>
        <h1 id="auth-title">Welcome back</h1>
        <p class="sub" id="auth-sub">Sign in to continue your recovery.</p>

        <div id="auth-error" class="error hidden"></div>

        <form id="auth-form">
          <div class="field hidden" id="name-field">
            <label for="name">Name</label>
            <input id="name" type="text" autocomplete="name" placeholder="Alex Rivera" />
          </div>
          <div class="field">
            <label for="email">Email</label>
            <input id="email" type="email" autocomplete="email" placeholder="you@example.com" required />
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input id="password" type="password" autocomplete="current-password" placeholder="••••••••" required />
          </div>
          <button class="btn btn-block" type="submit" id="auth-submit">Sign in</button>
        </form>

        <p class="auth-toggle">
          <span id="auth-toggle-text">New here?</span>
          <button type="button" id="auth-toggle-btn">Create an account</button>
        </p>
      </div>
    </div>

    <!-- App shell -->
    <div id="app" class="app hidden">
      <header class="topbar">
        <div class="brand"><span class="dot">R</span> Recovery Tracker</div>
        <div class="between">
          <span class="who" id="who"></span>
          <button class="btn btn-ghost btn-sm" id="signout">Sign out</button>
        </div>
      </header>

      <nav class="nav" id="nav">
        <button data-view="dashboard" class="active">Dashboard</button>
        <button data-view="workouts">Workouts</button>
        <button data-view="routines">Routines</button>
        <button data-view="schedule">Schedule</button>
        <button data-view="pain">Pain</button>
        <button data-view="plans">Plans</button>
      </nav>

      <main class="main" id="main"></main>
    </div>

    <!-- Dialog mount + toast -->
    <div id="dialog-root"></div>
    <div id="toast" class="toast"></div>

    <script src="app.js"></script>
  </body>
</html>
